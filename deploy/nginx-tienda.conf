# Nginx — Tienda de Repuestos
# Sirve el frontend compilado (dist) y hace de proxy /api hacia uvicorn.

server {
    listen 80;
    server_name _;

    root /opt/tienda/frontend/dist;
    index index.html;

    # React Router: cualquier ruta del navegador cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Las fotos del catálogo (servidas desde dist/imagenes)
    location /imagenes/ {
        try_files $uri =404;
    }

    # La API (FastAPI en el puerto 8000, solo accesible internamente)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
